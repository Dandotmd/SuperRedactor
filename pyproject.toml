[project]
name = "superredactor"
version = "0.1.0"
description = "Local web app to redact/scramble PII columns in CSV and Excel files before sharing with AI tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "faker>=24.0",
]

[project.optional-dependencies]
# Dev only, and deliberately kept that way: the runtime list above is what a
# locked-down machine has to approve, and the app still needs no node
# toolchain. `playwright` rather than `pytest-playwright` because the browser
# tests supply their own fixtures — that keeps the extra to one package (plus
# greenlet and pyee) and lets a missing browser skip with an explanation
# instead of erroring inside someone else's fixture.
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.49"]

[project.scripts]
superredactor = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # `pytest -m ui` runs only these; `pytest -m 'not ui'` skips them outright.
    # Left in the default run on purpose: they skip themselves with an
    # explanation when the browser is missing, and a suite that silently
    # stops covering the warnings is the failure mode worth avoiding.
    "ui: drives the page in a real browser (needs `playwright install chromium`)",
]
filterwarnings = [
    # starlette-internal deprecation about its own httpx test dependency
    "ignore:Using `httpx` with `starlette.testclient`",
]
